<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF 보기</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="viewer-body">
    <header class="viewer-bar">
      <a class="back-link" href="/" id="back-link">← 검색으로</a>
      <div class="viewer-title-wrap">
        <h1 class="viewer-title" id="viewer-title">PDF</h1>
        <p class="viewer-sub" id="viewer-sub"></p>
      </div>
      <div class="viewer-actions">
        <button type="button" class="page-btn" id="prev-page" title="이전 쪽">‹</button>
        <label class="page-jump">
          <span class="sr-only">쪽</span>
          <input type="number" id="page-input" min="1" value="1" />
          <span id="page-label">쪽</span>
        </label>
        <button type="button" class="page-btn" id="next-page" title="다음 쪽">›</button>
        <a class="open-raw" id="open-raw" href="#" target="_blank" rel="noopener noreferrer">새 탭</a>
      </div>
    </header>
    <main class="viewer-main">
      <iframe id="pdf-frame" title="PDF 미리보기"></iframe>
      <p id="viewer-error" class="viewer-error" hidden></p>
    </main>
    <script src="/static/view.js" type="module"></script>
  </body>
</html>
