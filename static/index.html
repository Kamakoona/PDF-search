<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF 키워드 검색</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/cloud.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="top">
      <div class="brand">
        <span class="brand-glyph" aria-hidden="true"></span>
        <div>
          <p class="brand-kicker">Local Folder PDF Search</p>
          <h1 class="brand-title">PDF 키워드 검색</h1>
        </div>
      </div>
      <div class="header-meta">
        <time id="current-time" class="current-time" aria-live="polite">--:--</time>
        <p class="greeting">안녕하세요, 반갑습니다 👋</p>
      </div>
    </header>

    <main class="layout">
      <section class="intro">
        <p class="lead">
          내 컴퓨터의 PDF 폴더를 선택한 뒤 키워드를 입력하면,
          하위 폴더까지 내용을 검색해 일치하는 파일과 구문을 보여 줍니다.
          결과는 클릭하면 해당 페이지가 열립니다. 파일은 서버로 업로드되지 않습니다.
        </p>

        <form id="search-form" class="panel" autocomplete="off">
          <div class="field">
            <span class="label">PDF 폴더</span>
            <div class="upload-row">
              <input
                id="folder-display"
                type="text"
                readonly
                placeholder="선택된 폴더가 여기에 표시됩니다"
              />
              <button type="button" id="pick-folder-btn" class="secondary-btn">폴더 선택</button>
            </div>
            <input id="folder-fallback" type="file" webkitdirectory multiple hidden />
            <p class="hint" id="folder-hint">탐색기에서 폴더를 고르면 그 안의 PDF(하위 폴더 포함)를 검색합니다.</p>
          </div>

          <label class="field">
            <span class="label">검색 키워드</span>
            <div class="keyword-row">
              <input
                id="keyword"
                name="keyword"
                type="search"
                placeholder="예: 개인정보, 근로시간, 허가"
                maxlength="200"
                required
              />
              <button type="submit" id="search-btn">검색</button>
              <button type="button" id="stop-btn" class="stop-btn" disabled>중지</button>
              <button type="button" id="restart-btn" class="restart-btn" disabled>다시</button>
            </div>
          </label>

          <div class="options">
            <label class="check">
              <input type="checkbox" id="case-sensitive" />
              대소문자 구분
            </label>
          </div>
        </form>
      </section>

      <section id="status" class="status" hidden></section>
      <section id="summary" class="summary" hidden></section>
      <section id="results" class="results" aria-live="polite"></section>
    </main>

    <footer class="foot">
      <p>
        선택한 폴더의 PDF는 브라우저에서만 읽습니다. 텍스트 PDF만 검색되며, 스캔(이미지) PDF는 제외될 수 있습니다.
      </p>
    </footer>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
